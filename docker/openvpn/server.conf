# Published by the admin backend on PKI initialization; existing configuration is preserved.
# Network, port, protocol and pushed DNS are added to /run/openvpn/server.conf from env.
dev tun
topology subnet
ca /etc/openvpn/runtime/ca.crt
cert /etc/openvpn/runtime/server.crt
key /etc/openvpn/runtime/server.key
crl-verify /etc/openvpn/runtime/crl.pem
dh none
tls-crypt /etc/openvpn/runtime/tls-crypt.key
tls-version-min 1.2
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
verify-client-cert require
remote-cert-tls client
client-config-dir /etc/openvpn/ccd
keepalive 10 60
persist-key
persist-tun
user desk
group desk
status /run/openvpn/status.log 10
status-version 3
verb 3
